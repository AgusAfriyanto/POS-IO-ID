<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Barcode Blueprint GL-A44 (32x19mm)</title>
    <script src="https://cdn.jsdelivr.net/npm/bwip-js@3.0.4/dist/bwip-js-min.js"></script>
    <style>
        @page {
            size: A4 portrait;
            margin: 8mm 4mm 8mm 4mm;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background: #f4f6f9;
        }
        .no-print {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .grid-container {
            width: 202mm;
            display: grid;
            grid-template-columns: repeat(6, 32mm);
            grid-auto-rows: 19mm;
            column-gap: 1.8mm;
            row-gap: 0.2mm;
            margin: 0 auto;
        }
        .label-box {
            width: 32mm;
            height: 19mm;
            border: 1px dashed #ccc;
            box-sizing: border-box;
            padding: 0.8mm 0.5mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            background: white;
            overflow: hidden;
        }
        .title {
            font-size: 7.5pt;
            font-weight: bold;
            line-height: 1;
            max-height: 5.5mm;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-word;
            color: #000;
        }
        .barcode-canvas {
            width: 90%;
            height: 8.5mm !important;
        }
        .price {
            font-size: 7.5pt;
            font-weight: bold;
            line-height: 1;
            color: #000;
        }

        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .label-box { border: none; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <h2>🖨️ Cetak Barcode Stiker (Blueprint GL-A44)</h2>
    <p><small>Judul barang dipendekkan otomatis agar pas di stiker 32x19mm.</small></p>

    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <div style="flex: 2;">
            <label><b>Pilih Barang dari Stok:</b></label>
            <select id="itemSelect"></select>
        </div>
        <div style="flex: 1;">
            <label><b>Jumlah Cetak (Pcs):</b></label>
            <input type="number" id="qtyInput" value="1" min="1">
        </div>
        <div style="flex: 1; align-self: flex-end;">
            <button onclick="tambahKeAntrean()" style="padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%;">➕ Tambah</button>
        </div>
    </div>

    <div style="display: flex; gap: 10px; align-items: center; margin-top: 15px; background: #e9ecef; padding: 10px; border-radius: 5px;">
        <label><b>Posisi Awal Stiker Kosong (Offset):</b></label>
        <input type="number" id="offsetInput" value="0" min="0" max="83" style="width: 70px;" onchange="renderGrid()">
        <small style="color: #555;">(Isi jika kertas stiker A4 sudah terpakai sebagian sebelumnya)</small>
    </div>

    <div id="antreanList" style="margin-top: 15px;"></div>

    <button onclick="window.print()" style="margin-top: 15px; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%;">🖨️ Cetak ke Epson L360 (Ctrl + P)</button>
</div>

<!-- CONTAINER LAYOUT A4 (6 KOLOM x 14 BARIS) -->
<div class="grid-container" id="gridContainer"></div>

<script>
    // ⚠️ MASUKKAN URL WEB APP ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycby6vLxkZJDrKuVuCmSyZyZ8eqdsXzgujr5xW8FvYFU9EuMHQPg5oXC76BpPWZ2XpBCv_A/exec";
    let inventoryData = [];
    let printQueue = [];

    function persingkatNamaBarang(namaFull) {
        if (!namaFull) return "SPAREPART";
        let text = namaFull.toUpperCase();

        let jenis = "";
        if (text.includes("LCD")) jenis = "LCD";
        else if (text.includes("BACKDOOR") || text.includes("BACKCOVER")) jenis = "BACKDOOR";
        else if (text.includes("BATTERAI") || text.includes("BATERAI") || text.includes("BATTERY")) jenis = "BATERE";
        else if (text.includes("FLEXIBLE") || text.includes("FLEX")) jenis = "FLEX";
        else if (text.includes("TOUCHSCREEN")) jenis = "TS";
        else if (text.includes("CHARGER") || text.includes("CAS")) jenis = "CHARGER";

        let wordsToRemove = [
            "SHINESTAR", "SUNSHINE", "TOUCHSCREEN", "BACKCOVER", "TUTUP", "BELAKANG", 
            "CASING", "ORIGINAL", "ORI", "FULLSET", "FRAME", "CONTRAS", "KONTRAS", 
            "BLACK", "HITAM", "WHITE", "PUTIH", "AAA", "MODULE"
        ];

        wordsToRemove.forEach(w => {
            let reg = new RegExp("\\b" + w + "\\b", "gi");
            text = text.replace(reg, "");
        });

        text = text.replace(/\s+/g, " ").trim();

        if (jenis && !text.startsWith(jenis)) {
            text = jenis + " " + text;
        }

        if (text.length > 28) {
            text = text.substring(0, 28);
        }

        return text;
    }

    async function loadData() {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "getInventory" })
            });
            const result = await response.json();
            if(result.status === "success") {
                inventoryData = result.data;
                const select = document.getElementById('itemSelect');
                select.innerHTML = inventoryData.map(item => `
                    <option value="${item.sku}">[${item.sku}] ${persingkatNamaBarang(item.nama_barang)} - Rp ${parseInt(item.harga_jual || 0).toLocaleString('id-ID')}</option>
                `).join('');
            }
        } catch(e) {
            alert("Gagal mengambil data inventory!");
        }
    }

    function tambahKeAntrean() {
        const sku = document.getElementById('itemSelect').value;
        const qty = parseInt(document.getElementById('qtyInput').value) || 1;
        const item = inventoryData.find(i => i.sku === sku);

        if(item) {
            printQueue.push({ item: item, qty: qty });
            renderAntrean();
            renderGrid();
        }
    }

    function hapusAntrean(index) {
        printQueue.splice(index, 1);
        renderAntrean();
        renderGrid();
    }

    function renderAntrean() {
        const div = document.getElementById('antreanList');
        if(printQueue.length === 0) {
            div.innerHTML = "<i>Belum ada barang di dalam antrean cetak.</i>";
            return;
        }
        div.innerHTML = "<b>Antrean Cetak:</b>" + printQueue.map((q, idx) => `
            <div style="background: white; border: 1px solid #ddd; padding: 6px 10px; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px;">
                <span>[<b>${q.item.sku}</b>] ${persingkatNamaBarang(q.item.nama_barang)} (<b>${q.qty} Pcs</b>)</span>
                <button onclick="hapusAntrean(${idx})" style="background: red; color: white; border: none; border-radius: 3px; cursor: pointer;">Hapus</button>
            </div>
        `).join('');
    }

    function renderGrid() {
        const container = document.getElementById('gridContainer');
        container.innerHTML = "";

        const offset = parseInt(document.getElementById('offsetInput').value) || 0;

        for(let o = 0; o < offset; o++) {
            const emptyBox = document.createElement('div');
            emptyBox.className = 'label-box';
            emptyBox.style.visibility = 'hidden';
            container.appendChild(emptyBox);
        }

        printQueue.forEach(q => {
            for(let i = 0; i < q.qty; i++) {
                const box = document.createElement('div');
                box.className = 'label-box';

                const title = document.createElement('div');
                title.className = 'title';
                title.innerText = persingkatNamaBarang(q.item.nama_barang);

                const canvas = document.createElement('canvas');
                canvas.className = 'barcode-canvas';

                const price = document.createElement('div');
                price.className = 'price';
                price.innerText = `Rp ${parseInt(q.item.harga_jual || 0).toLocaleString('id-ID')}`;

                box.appendChild(title);
                box.appendChild(canvas);
                box.appendChild(price);
                container.appendChild(box);

                // Render barcode menggunakan Canvas BWIP-JS (Sangat Stabil)
                try {
                    bwipjs.toCanvas(canvas, {
                        bcid:        'code128',
                        text:        q.item.sku || 'SP-000000',
                        scale:       2,
                        height:      8,
                        includetext: false
                    });
                } catch (e) {
                    console.error(e);
                }
            }
        });
    }

    loadData();
</script>
</body>
</html>
